# Runs on the VM in /home/azureuser/kf (copy this folder there). Secrets live in ./.env, never in git.
services:
  app:
    image: ghcr.io/lut4sayem/knowledgeforge-ai:latest
    restart: unless-stopped
    env_file: .env
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Xss512k"
      PORT: "8080"
      COLLAB_INTERNAL_URL: http://collab:1234
    ports:
      - "127.0.0.1:8080:8080" # for the update script's health check only

  # Live editing (Hocuspocus). Gets only what it needs from .env, not the database or AI secrets.
  collab:
    image: ghcr.io/lut4sayem/knowledgeforge-collab:latest
    restart: unless-stopped
    environment:
      COLLAB_SECRET: ${COLLAB_SECRET}
      APP_ORIGIN: ${APP_ORIGIN}
      SPRING_INTERNAL_URL: http://app:8080
      PORT: "1234"
      NODE_OPTIONS: "--max-old-space-size=128"
    mem_limit: 192m
    ports:
      - "127.0.0.1:1234:1234" # for the update script's health check only

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app, collab]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
