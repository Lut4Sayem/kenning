name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest # Docker is preinstalled (Testcontainers)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  collab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # @hocuspocus/server 4 needs Node 22+
          cache: npm
          cache-dependency-path: collab/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongodb/mongodb-atlas-local:8.0 # same image as the integration tests
        ports:
          - 27017:27017
    env:
      SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/kf_e2e?directConnection=true
      KF_AUTH_RATE_LIMIT_PER_MINUTE: "1000" # every spec registers and logs in from one IP
      COLLAB_SECRET: e2e-only-secret # shared by the app and the collaboration service
      APP_ORIGIN: http://localhost:8080
      VITE_COLLAB_URL: ws://localhost:1234 # no Caddy here: the browser talks to the collaboration service directly
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # the collaboration service needs 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            collab/package-lock.json
      # Builds the React app into the jar and leaves frontend/node_modules behind for Playwright.
      - run: ./mvnw -B -DskipTests package
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start the app
        run: |
          java -jar target/*.jar > app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fs http://localhost:8080/app/login > /dev/null && exit 0
            sleep 2
          done
          cat app.log
          exit 1
      - name: Start the collaboration service
        working-directory: collab
        run: |
          npm ci && npm run build
          node dist/main.js > ../collab.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://localhost:1234/health > /dev/null && exit 0
            sleep 1
          done
          cat ../collab.log
          exit 1
      - name: Run browser tests
        working-directory: frontend
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            app.log
            collab.log
          retention-days: 7
