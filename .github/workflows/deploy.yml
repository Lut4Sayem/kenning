name: Deploy image

# Builds the app and collaboration service images and pushes them to GHCR. The VM pulls them on a timer (deploy/update.sh).
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/lut4sayem/knowledgeforge-ai:latest
            ghcr.io/lut4sayem/knowledgeforge-ai:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - uses: docker/build-push-action@v7
        with:
          context: collab
          push: true
          tags: |
            ghcr.io/lut4sayem/knowledgeforge-collab:latest
            ghcr.io/lut4sayem/knowledgeforge-collab:${{ github.sha }}
          cache-from: type=gha,scope=collab
          cache-to: type=gha,mode=max,scope=collab
