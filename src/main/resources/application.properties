spring.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.auto-index-creation=true
# File uploads (keep max-file-size in sync with AttachmentService.MAX_FILE_BYTES)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# CSRF protection is on (SecurityConfig); the session cookie also stays off cross-site requests
server.servlet.session.cookie.same-site=lax

# AI assistant (Groq, OpenAI-compatible). Values come from env vars; the key is never committed.
ai.base-url=${AI_BASE_URL:}
ai.model=${AI_MODEL:}
ai.api-key=${AI_API_KEY:}

# Health endpoint only, no details (public for the uptime monitor)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Small thread pool for the 1 GB VM
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2

# Behind Caddy: use X-Forwarded-For so the login rate limit sees the real client IP
server.forward-headers-strategy=native
# Login/register attempts per minute per IP (CI e2e raises this)
kf.auth.rate-limit-per-minute=${KF_AUTH_RATE_LIMIT_PER_MINUTE:10}
