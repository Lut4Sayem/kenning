spring.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.auto-index-creation=true
# File uploads (keep max-file-size in sync with AttachmentService.MAX_FILE_BYTES)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# CSRF protection is on (SecurityConfig); the session cookie also stays off cross-site requests
server.servlet.session.cookie.same-site=lax

# AI assistant (Groq, OpenAI-compatible). Values come from env vars; the key is never committed.
ai.base-url=${AI_BASE_URL:}
ai.model=${AI_MODEL:}
ai.api-key=${AI_API_KEY:}

# Health endpoint only, no details (public for the uptime monitor)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Small thread pool for the 1 GB VM
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2

# Behind Caddy: use X-Forwarded-For so the login rate limit sees the real client IP.
# Only the Docker network (172.16.0.0/12, where Caddy runs) may set it; from anywhere else the header is ignored.
# Override with KF_TRUSTED_PROXIES (a regex) if Docker uses another address range.
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=${KF_TRUSTED_PROXIES:172[.](1[6-9]|2[0-9]|3[01])[.][0-9]+[.][0-9]+}
# Login/register attempts per minute per IP (CI e2e raises this)
kf.auth.rate-limit-per-minute=${KF_AUTH_RATE_LIMIT_PER_MINUTE:10}

# Collaboration service (live editing): shared secret for tickets and the internal API, and where to reach it
kf.collab.secret=${COLLAB_SECRET:}
kf.collab.url=${COLLAB_INTERNAL_URL:http://localhost:1234}
